{{define "title"}}Change Password - Home Lab Server Manager{{end}}

{{define "content"}}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="servers-table">
        <div style="padding: 20px; background-color: white;">
            <h2 style="margin-bottom: 20px; text-align: center;">Change Password</h2>
            <p style="margin-bottom: 20px; color: #666; text-align: center;">
                Please set a new secure password to continue.
            </p>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" required>
                </div>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" required minlength="8">
                    <small style="color: #666;">Must be at least 8 characters</small>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}

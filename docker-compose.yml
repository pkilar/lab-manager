services:
  lab-manager:
    build: .
    image: registry.home.kilar.net/lab-manager:latest
    container_name: lab-manager
    network_mode: host
    volumes:
      # Persist SQLite database and encryption key
      - ./instance:/app/instance
    environment:
      # Session-cookie signing key. Generate with: openssl rand -hex 32
      # Optional: if empty, the app generates a random key per boot (sessions won't persist).
      - LAB_MANAGER_SECRET_KEY=${LAB_MANAGER_SECRET_KEY:-}
      # Fernet key for encrypting stored credentials. If empty, a key is
      # auto-generated and saved to instance/.encryption_key.
      - LAB_MANAGER_ENCRYPTION_KEY=${LAB_MANAGER_ENCRYPTION_KEY:-}
      # Wake-on-LAN is OFF by default. Requires host networking to work (already
      # set above via network_mode: host). See README "Wake-on-LAN".
      - WOL_ENABLED=${WOL_ENABLED:-false}
      # iDRAC KVM reverse proxy. Empty disables the feature (and hides the KVM
      # button). For local development set it to "localhost": the app then also
      # answers idrac-<id>.localhost:5000, which resolves to 127.0.0.1 and,
      # under host networking, reaches the BMC directly. Production uses the
      # real base domain plus the Traefik idrac-* router in docker-stack.yml.
      #   LAB_MANAGER_BMC_PROXY_DOMAIN=localhost docker compose up -d --build
      - LAB_MANAGER_BMC_PROXY_DOMAIN=${LAB_MANAGER_BMC_PROXY_DOMAIN:-}
    restart: unless-stopped

services:
  lab-manager:
    build: .
    image: registry.home.kilar.net/lab-manager:latest
    container_name: lab-manager
    network_mode: host
    volumes:
      # Persist SQLite database and encryption key
      - ./instance:/app/instance
    environment:
      # IMPORTANT: Set these in production! Read from the environment or .env file.
      # Generate SECRET_KEY with: python -c "import secrets; print(secrets.token_hex(32))"
      # Optional: if empty, the app generates a random key per boot (sessions won't persist).
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      # Generate ENCRYPTION_KEY with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # NOTE: If not set, a key will be auto-generated and saved to instance/.encryption_key
      - FLASK_ENCRYPTION_KEY=${FLASK_ENCRYPTION_KEY:-}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      # Wake-on-LAN is OFF by default. Requires host networking to work (already
      # set above via network_mode: host). See README "Wake-on-LAN".
      - WOL_ENABLED=${WOL_ENABLED:-false}
    restart: unless-stopped

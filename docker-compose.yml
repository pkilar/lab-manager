services:
  lab-manager:
    build: .
    container_name: lab-manager
    ports:
      - "5000:5000"
    volumes:
      # Persist SQLite database
      - ./instance:/app/instance
    environment:
      # Override default SECRET_KEY for production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-secret-key-in-production}
      - FLASK_ENV=${FLASK_ENV:-production}
    restart: unless-stopped
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

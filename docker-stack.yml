# Docker Swarm stack for Home Lab Server Manager.
#
# Deploy:
#   docker stack deploy -c docker-stack.yml --with-registry-auth lab-manager
#
# --with-registry-auth is REQUIRED so worker nodes receive the credentials to
# pull from the private registry (registry.home.kilar.net).
#
# Why this is separate from docker-compose.yml:
#   `docker stack deploy` IGNORES build:, container_name:, network_mode:, and
#   restart:. So Swarm never builds (it pulls the image from the registry),
#   Traefik routing is wired via deploy.labels + the traefik-public overlay
#   (see below), and restart/update behavior lives under `deploy:`.
version: "3.8"

services:
  lab-manager:
    image: registry.home.kilar.net/lab-manager:latest
    # For reproducible rollouts, pin to an immutable tag instead of :latest, e.g.
    #   image: registry.home.kilar.net/lab-manager:<git-short-sha>

    # Joined to the shared `traefik-public` overlay so Traefik's swarm provider can
    # route to it (see deploy.labels below). NOTE: this replaces the old host-network
    # setup — Wake-on-LAN can no longer work here, since magic packets are L2
    # broadcasts that won't leave an overlay (WoL needs `network_mode: host`).
    networks:
      - traefik-public

    environment:
      # Persisted session key. Supplied at `docker stack deploy` time from the
      # shell/.env; if empty the app generates a random key per start (sessions
      # won't survive a restart). Recommended to set one.
      - LAB_MANAGER_SECRET_KEY=${LAB_MANAGER_SECRET_KEY:-}
      # LAB_MANAGER_ENCRYPTION_KEY is deliberately NOT passed here. Under this
      # deploy the Fernet key lives on the lab_manager_instance volume
      # (instance/.encryption_key), generated on first start and persisted; the
      # env var could only ever duplicate it or contradict it. Both failure
      # modes are bad and neither is loud:
      #   - a malformed value is rejected and silently falls back to the file,
      #     so the variable looks set while doing nothing (this happened: a
      #     6-character placeholder sat here logging one ERROR line per start);
      #   - a well-formed but DIFFERENT value is accepted, and every stored
      #     credential immediately decrypts to garbage.
      # Back the key up off the volume instead - see README "Backing up the
      # encryption key". Restore by writing the file, not by setting this.
      # Wake-on-LAN is OFF by default. It does NOT work under this overlay-networked
      # deploy (magic packets need host networking); leave it false here.
      - WOL_ENABLED=${WOL_ENABLED:-false}
      # BMC KVM reverse proxy (iDRAC + PiKVM auto-login). Set to the base domain
      # so the app answers idrac-<id>.<domain> / pikvm-<id>.<domain> and the
      # Console button logs in. Requires the lab-manager-bmc Traefik router
      # below; *.pi.home.kilar.net wildcard DNS already resolves and the default
      # *.pi cert covers it. Empty disables the feature.
      - LAB_MANAGER_BMC_PROXY_DOMAIN=${LAB_MANAGER_BMC_PROXY_DOMAIN:-}
      # Refuse to start if the settings above came through empty. Deliberately a
      # LITERAL, not ${LAB_MANAGER_STRICT_CONFIG} — `docker stack deploy` reads
      # ${...} from the DEPLOYING SHELL and not from .env, so an interpolated
      # guard would be erased by the very mistake it guards against.
      #
      # Without it a redeploy that forgets to export the variables starts a
      # healthy-looking container that has silently lost KVM auto-login and
      # signs sessions with a fresh random key on every boot. That has happened.
      #
      # Deploy with the values in the Portainer stack environment, or export
      # them first — do NOT `source .env`, which holds the LOCAL dev values.
      - LAB_MANAGER_STRICT_CONFIG=true

    volumes:
      # SQLite DB + encryption key. A named volume keeps the data on the pinned
      # node (see placement constraint). To inspect the DB, find it under the
      # volume's mountpoint: `docker volume inspect lab-manager_lab_manager_instance`.
      - lab_manager_instance:/app/instance

    healthcheck:
      # /login is unauthenticated and returns 200; busybox wget ships in the image.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      # Traefik's swarm provider reads these labels to publish the app at
      # https://lab.pi.home.kilar.net. The cluster's default TLS cert is the
      # Let's Encrypt wildcard *.pi.home.kilar.net, so `tls=true` alone yields a
      # valid cert — no per-router certresolver needed.
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.lab-manager.rule=Host(`lab.pi.home.kilar.net`)"
        - "traefik.http.routers.lab-manager.entrypoints=websecure"
        - "traefik.http.routers.lab-manager.tls=true"
        - "traefik.http.services.lab-manager.loadbalancer.server.port=5000"
        # BMC KVM reverse proxy: route every idrac-<n> / pikvm-<n>.pi.home.kilar.net
        # to this same service (the app resolves the BMC by id from the Host).
        # Reuses the default *.pi cert via tls=true. Traefik v3 HostRegexp takes a
        # Go regexp.
        # Only effective when LAB_MANAGER_BMC_PROXY_DOMAIN is set above.
        # NOTE: the trailing `$$` is an ESCAPED `$` — Compose/Portainer do env-var
        # interpolation on `$`, so a lone `$` anchor makes Portainer 500. `$$`
        # un-escapes to a single `$` for Traefik (and a literal `$$` still matches).
        - "traefik.http.routers.lab-manager-bmc.rule=HostRegexp(`^(idrac|pikvm)-[0-9]+\\.pi\\.home\\.kilar\\.net$$`)"
        - "traefik.http.routers.lab-manager-bmc.entrypoints=websecure"
        - "traefik.http.routers.lab-manager-bmc.tls=true"
        - "traefik.http.routers.lab-manager-bmc.service=lab-manager"
        # The iDRAC HTML5 virtual console runs on a SEPARATE TLS listener on
        # 5900 (iDRAC only: a PiKVM serves everything, KVM included, on 443, so
        # this router stays idrac-* only). Its SPA builds the URL from
        # window.location.host, so the browser asks for
        # idrac-<n>.pi.home.kilar.net:5900 — which Traefik must accept and hand
        # to this same service (the app forwards it to the BMC's 5900;
        # see bmcproxy.upstreamHost). Without this the console request fails
        # with ERR_CONNECTION_REFUSED while the rest of the iDRAC UI works.
        #
        # PREREQUISITE, outside this repo: Traefik needs a `bmcconsole`
        # entrypoint on :5900 in its STATIC config, and must publish that port.
        # It lives in ~/Devel/pi-cluster-ansible, not here. Until it exists this
        # router is inert (Traefik logs an unknown-entrypoint warning).
        - "traefik.http.routers.lab-manager-bmcconsole.rule=HostRegexp(`^idrac-[0-9]+\\.pi\\.home\\.kilar\\.net$$`)"
        - "traefik.http.routers.lab-manager-bmcconsole.entrypoints=bmcconsole"
        - "traefik.http.routers.lab-manager-bmcconsole.tls=true"
        - "traefik.http.routers.lab-manager-bmcconsole.service=lab-manager"
      # SQLite has no concurrent-write safety: run exactly ONE task, pinned to one
      # node so the data volume is always the same physical volume.
      replicas: 1
      placement:
        constraints:
          # Pin to a specific data node. Label it once before first deploy:
          #   docker node update --label-add lab_manager_data=true <node-name>
          # (Alternative for a single-manager swarm: node.role == manager)
          - node.labels.lab_manager_data == true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        # stop-first prevents two tasks writing the SQLite DB at once during an
        # update — the Swarm equivalent of Kubernetes' Recreate strategy.
        order: stop-first
        parallelism: 1
      rollback_config:
        order: stop-first
        parallelism: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 128M
          cpus: "0.10"

networks:
  # Shared overlay created by the Traefik stack (pi-cluster-ansible). Declared
  # external so this stack joins it instead of creating its own; Traefik's swarm
  # provider only routes to services attached to this network.
  traefik-public:
    external: true
    name: traefik-public

volumes:
  lab_manager_instance:
    driver: local

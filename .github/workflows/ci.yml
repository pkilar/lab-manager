name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against a pinned dependency surfaces
    # even when nothing has been pushed for a while.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth: the `go` directive in go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # ipmitool is exec'd by internal/power and internal/sol. The tests use an
      # injectable runner and never shell out, but installing it keeps the CI
      # environment honest against the Dockerfile runtime.
      - name: Install ipmitool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ipmitool

      - name: go test (race)
        run: go test -race ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./cmd/lab-manager

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # Scans only the commits this push/PR adds, never full history: an old, rotated
  # session key lives in 771e3ba and would fail every run. Built from source via
  # the module proxy (checksum-verified) at an explicit version.
  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gitleaks (new commits only)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "${BEFORE#0}" != "$BEFORE" ] && [ -z "${BEFORE//0/}" ]; then
            range="-1"   # new branch: no previous tip, scan the tip commit only
          else
            range="$BEFORE..HEAD"
          fi
          echo "gitleaks log-opts: $range"
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .
